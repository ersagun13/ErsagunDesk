name: Build, Test & Package ErsagunDesk

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore ErsagunDesk.sln

      - name: Build Solution (Release)
        run: dotnet build ErsagunDesk.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/ErsagunDesk.Tests/ErsagunDesk.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish Single-File Executable
        run: >
          dotnet publish ErsagunDesk.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErsagunDesk-windows-x64
          path: dist/ErsagunDesk.exe
          if-no-files-found: error
